[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-neo"
version = "0.1.0"
description = "ASTRO-NEO orchestration services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pinned exact, not ~=: "~=0.115" is far looser than it looks (allows
    # anything up to 1.0) and a routine rebuild pulled fastapi 0.141.1 with
    # starlette 1.6.0, which silently broke TemplateResponse's old calling
    # convention -- a live outage caught only by chance during unrelated
    # work. Pinned to the exact versions now confirmed working together;
    # bump deliberately, not implicitly on the next rebuild.
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]~=0.30",
    "pydantic-settings~=2.4",
    "pyyaml~=6.0",
    "httpx~=0.27",
    "jinja2>=3.1",
    "python-multipart~=0.0.9",
    "numpy>=1.26,<2.0",
    "astropy>=6.0,<7.0",
    "astroplan~=0.9",
    "astroquery~=0.4",
    "sqlmodel~=0.0.16",
    "alembic~=1.13",
    "psycopg[binary,pool]~=3.1",
    "prometheus-client~=0.20",
    "photutils~=1.12",
    "Pillow~=10.4",
    "matplotlib~=3.8",
    "scipy~=1.11",
    "lxml~=5.1",
    "python-json-logger~=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "httpx~=0.27",
]

[tool.setuptools.packages.find]
where = ["app"]
